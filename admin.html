<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEGUIDE — Admin Panel</title>
    <meta name="robots" content="noindex,nofollow">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <script>window.lucide = window.lucide || { createIcons: function () {} };</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #2a2e3f; border-radius: 8px; }
        input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(225,29,72,.45); }
        body { font-family: 'Inter', sans-serif; background-color: #090a0f; color: #f8fafc; }
        .bg-card { background-color: #12141d; }
        .bg-elevated { background-color: #1b1e2b; }
        .border-subtle { border-color: rgba(255, 255, 255, 0.09); }
        .accent-bg { background-color: #e11d48; }
        .accent-text { color: #e11d48; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ================= ADMIN LOGIN (Firebase Authentication) ================= -->
    <div id="adminLockScreen" class="fixed inset-0 z-50 bg-[#090a0f] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-card border border-subtle rounded-3xl max-w-sm w-full p-7 shadow-2xl text-center">
            <div class="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-500 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-black tracking-wide mb-1"><span class="accent-text">CINE</span>GUIDE ADMIN</h1>
            <p class="text-xs text-slate-400 mb-6">Sign in with your admin e-mail</p>

            <p id="loginChecking" class="text-xs text-slate-400 py-6">Checking sign-in…</p>

            <div id="loginForm" class="hidden">
                <form onsubmit="CloudStore.login(event)" class="space-y-3">
                    <input type="email" id="adminEmailInput" required autocomplete="username" placeholder="Admin e-mail" class="w-full px-4 py-3 rounded-xl bg-[#090a0f] border border-subtle text-sm text-center focus:outline-none focus:border-rose-500">
                    <input type="password" id="adminPassInput" required autocomplete="current-password" placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-[#090a0f] border border-subtle text-sm text-center focus:outline-none focus:border-rose-500">
                    <p id="loginMsg" class="hidden text-xs mb-1"></p>
                    <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl accent-bg hover:opacity-95 text-white font-extrabold text-sm transition">Sign in</button>
                </form>
                <button type="button" onclick="CloudStore.forgot()" class="mt-3 text-xs text-slate-400 hover:text-white underline">Forgot password?</button>
                <div class="flex items-center gap-3 my-4"><span class="flex-1 h-px bg-white/10"></span><span class="text-[10px] uppercase text-slate-500">or</span><span class="flex-1 h-px bg-white/10"></span></div>
                <button type="button" onclick="CloudStore.google()" class="w-full py-3 rounded-xl bg-white/5 border border-subtle hover:bg-white/10 text-slate-100 font-bold text-sm">Continue with Google</button>
            </div>
            <a href="index.html" class="inline-block mt-5 text-xs text-slate-400 hover:text-white">← Back to Main Website</a>
        </div>
    </div>

    <!-- ================= MAIN ADMIN DASHBOARD ================= -->
    <div id="adminAppWrapper" class="hidden flex-1 flex flex-col lg:flex-row">
        
        <!-- LEFT SIDEBAR NAVIGATION -->
        <aside class="w-full lg:w-64 bg-card border-b lg:border-b-0 lg:border-r border-subtle p-4 flex flex-col justify-between shrink-0">
            <div>
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-subtle">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="font-black tracking-wider text-base"><span class="accent-text">CINE</span>ADMIN</span>
                    </div>
                    <a href="index.html" target="_blank" class="px-2.5 py-1 rounded-lg bg-elevated text-[11px] font-bold text-slate-300 hover:text-white flex items-center gap-1">
                        Live Site <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                </div>

                <!-- Navigation Tabs (Added Manage Posts Tab) -->
                <button onclick="openCommandPalette()" class="hidden lg:flex w-full items-center justify-between mb-3 px-3 py-2 rounded-xl bg-elevated text-[11px] text-slate-400 hover:text-white"><span class="flex items-center gap-2"><i data-lucide="search" class="w-3.5 h-3.5"></i> Quick search</span><span>Ctrl K</span></button>
                <nav class="flex lg:flex-col gap-1.5 overflow-x-auto no-scrollbar">
                    <button onclick="switchAdminTab('dashboard')" id="navBtn-dashboard" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold accent-bg text-white whitespace-nowrap">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </button>
                    <button onclick="switchAdminTab('posts')" id="navBtn-posts" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add New Post
                    </button>
                    <button onclick="switchAdminTab('manage')" id="navBtn-manage" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="film" class="w-4 h-4"></i> Manage Posts
                    </button>
                    <button onclick="switchAdminTab('upcoming')" id="navBtn-upcoming" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="calendar-clock" class="w-4 h-4"></i> Upcoming Releases
                    </button>
                    <button onclick="switchAdminTab('categories')" id="navBtn-categories" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i> Categories & Ads
                    </button>
                    <button onclick="switchAdminTab('users')" id="navBtn-users" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="users" class="w-4 h-4"></i> Users & Comments
                    </button>
                    <button onclick="switchAdminTab('features')" id="navBtn-features" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="toggle-right" class="w-4 h-4"></i> Site Features
                    </button>
                    <button onclick="switchAdminTab('settings')" id="navBtn-settings" class="admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap">
                        <i data-lucide="settings" class="w-4 h-4"></i> SEO, Footer & Security
                    </button>
                </nav>
            </div>

            <div class="block pt-4 border-t border-subtle">
                <button onclick="logoutAdmin()" class="w-full py-2.5 px-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Lock Admin Panel
                </button>
            </div>
        </aside>

        <!-- RIGHT CONTENT AREA -->
        <main class="flex-1 p-4 sm:p-7 overflow-y-auto max-w-6xl mx-auto w-full">
            <section id="tabSection-dashboard" class="admin-tab-section"></section>
            <section id="tabSection-posts" class="admin-tab-section hidden"></section>
            <section id="tabSection-manage" class="admin-tab-section hidden"></section>
            <section id="tabSection-upcoming" class="admin-tab-section hidden"></section>
            <section id="tabSection-categories" class="admin-tab-section hidden"></section>
            <section id="tabSection-users" class="admin-tab-section hidden"></section>
            <section id="tabSection-features" class="admin-tab-section hidden"></section>
            <section id="tabSection-settings" class="admin-tab-section hidden"></section>
        </main>
    </div>

    <!-- ADMIN TOAST NOTIFICATION -->
    <div id="adminToast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-2xl bg-emerald-600 text-white font-bold text-xs shadow-2xl items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        <span id="adminToastText">Saved successfully!</span>
    </div>

    <!-- CORE ADMIN CONTROLLER -->
    <script>
        function esc(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function safeParse(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null || raw === '') return fallback;
                const v = JSON.parse(raw);
                return v === null || v === undefined ? fallback : v;
            } catch (e) { return fallback; }
        }
        function safeSave(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); return true; }
            catch (e) { alert('Could not save the change.'); return false; }
        }
        function toEmbedUrl(url) {
            if (!url) return '';
            url = String(url).trim();
            const m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
            if (m) return 'https://www.youtube.com/embed/' + m[1];
            return /^https?:\/\//.test(url) ? url : '';
        }

        // Opened by admin-modules/cloud-store.js once Firebase confirms the signed-in account is the admin
        function unlockDashboard() {
            document.getElementById('adminLockScreen').classList.add('hidden');
            document.getElementById('adminAppWrapper').classList.remove('hidden');
            initAllAdminModules();
            switchAdminTab('dashboard');
        }

        function logoutAdmin() { CloudStore.logout(); }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-tab-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`tabSection-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.admin-nav-btn').forEach(b => {
                b.className = "admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-white/5 whitespace-nowrap";
            });
            document.getElementById(`navBtn-${tabName}`).className = "admin-nav-btn flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold accent-bg text-white whitespace-nowrap";
            
            // Refresh manage posts list if switching to manage tab
            if (tabName === 'dashboard' && typeof renderAdminDashboard === 'function') renderAdminDashboard();
            if (tabName === 'manage' && typeof renderAdminPublishedPosts === 'function') {
                renderAdminPublishedPosts();
            }
            lucide.createIcons();
            window.scrollTo({ top: 0 });
        }

        function showAdminToast(msg) {
            const t = document.getElementById('adminToast');
            document.getElementById('adminToastText').textContent = msg;
            t.classList.remove('hidden');
            t.classList.add('flex');
            setTimeout(() => { t.classList.add('hidden'); t.classList.remove('flex'); }, 3000);
        }

        function initAllAdminModules() {
            if (typeof initPostsModule === 'function') initPostsModule();
            if (typeof initUpcomingModule === 'function') initUpcomingModule();
            if (typeof initCategoriesAdsModule === 'function') initCategoriesAdsModule();
            if (typeof initUsersCommentsModule === 'function') initUsersCommentsModule();
            if (typeof initSettingsSecurityModule === 'function') initSettingsSecurityModule();
            if (typeof initFeaturesModule === 'function') initFeaturesModule();
            if (typeof initCloudStoreModule === 'function') initCloudStoreModule();
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
    </script>

    <!-- FIREBASE (e-mail / Google sign-in + cloud storage) -->
    <script>window.CINE_ADMIN_PAGE = true;</script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="core-data/firebase-config.js"></script>
    <script src="core-data/firebase-sync.js"></script>

    <!-- DATA LAYER (separate folder: posts, comments, API key live here) -->
    <script src="core-data/config.js"></script>
    <script src="core-data/demo-data.js"></script>
    <script src="core-data/store.js"></script>

    <!-- MODULAR FEATURE SCRIPTS -->
    <script src="admin-modules/dashboard.js"></script>
    <script src="admin-modules/posts-api.js"></script>
    <script src="admin-modules/upcoming.js"></script>
    <script src="admin-modules/categories-ads.js"></script>
    <script src="admin-modules/users-comments.js"></script>
    <script src="admin-modules/settings-security.js"></script>
    <script src="admin-modules/features.js"></script>
    <script src="admin-modules/cloud-store.js"></script>
</body>
</html>
