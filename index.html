<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEGUIDE — Verified Movie & Anime Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090a0f; color: #f8fafc; }
        .bg-card { background-color: #12141d; }
        .bg-elevated { background-color: #1b1e2b; }
        .border-subtle { border-color: rgba(255, 255, 255, 0.09); }
        .accent-bg { background-color: #e11d48; }
        .accent-text { color: #e11d48; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-rose-500 selection:text-white pb-20">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-[#090a0f]/90 backdrop-blur-md border-b border-subtle px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <a href="index.html" class="flex items-center gap-2">
                <span class="font-black text-lg tracking-wider"><span class="accent-text">CINE</span>GUIDE</span>
            </a>
            
            <div class="flex-1 max-w-xs relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="liveSearchInput" oninput="handleLiveSearch(this.value)" placeholder="Search movies, series..." class="w-full pl-9 pr-3 py-2 rounded-xl bg-card border border-subtle text-xs focus:outline-none focus:border-rose-500">
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openWatchlistModal()" class="p-2 rounded-xl bg-card border border-subtle relative">
                    <i data-lucide="bookmark" class="w-4 h-4 text-slate-300"></i>
                </button>
                <button onclick="openUserAuthModal()" id="userAuthNavBtn" class="px-3 py-1.5 rounded-xl accent-bg text-white font-bold text-xs">
                    Login
                </button>
            </div>
        </div>

        <!-- Category Filter Tabs -->
        <div class="max-w-4xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar pt-3 pb-1 text-xs font-bold">
            <button onclick="filterByCategory('All')" id="catBtn-All" class="cat-tab px-3.5 py-1.5 rounded-xl bg-rose-600 text-white whitespace-nowrap">Home</button>
            <button onclick="filterByCategory('Movie')" id="catBtn-Movie" class="cat-tab px-3.5 py-1.5 rounded-xl bg-card border border-subtle text-slate-300 whitespace-nowrap">Movies</button>
            <button onclick="filterByCategory('TV Series')" id="catBtn-TV Series" class="cat-tab px-3.5 py-1.5 rounded-xl bg-card border border-subtle text-slate-300 whitespace-nowrap">TV Series</button>
            <button onclick="filterByCategory('Anime')" id="catBtn-Anime" class="cat-tab px-3.5 py-1.5 rounded-xl bg-card border border-subtle text-slate-300 whitespace-nowrap">Anime</button>
        </div>
    </header>

    <!-- DYNAMIC MAIN CONTAINER -->
    <main id="mainContainer" class="flex-1 max-w-4xl mx-auto w-full p-4 space-y-6">
        <!-- Home / Feed View or Detail View rendered via JS -->
    </main>

    <!-- USER AUTHENTICATION MODAL -->
    <div id="userAuthModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-card border border-subtle rounded-3xl max-w-sm w-full p-6 relative">
            <button onclick="closeUserAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
            <h3 class="text-lg font-black mb-1">User Account</h3>
            <p class="text-xs text-slate-400 mb-4">Login to write comments and manage your watchlist.</p>
            <form onsubmit="handleUserLogin(event)" class="space-y-3">
                <input type="text" id="loginUsername" required placeholder="Your Name / Username" class="w-full px-3.5 py-2.5 rounded-xl bg-[#090a0f] border border-subtle text-xs">
                <button type="submit" class="w-full py-2.5 rounded-xl accent-bg text-white font-bold text-xs">Continue</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT CONTROLLER -->
    <script>
        // Default Demo Posts + LocalStorage Custom Posts
        const defaultPosts = [
            {
                id: 'def-1',
                slug: 'verity-2026',
                title: 'Verity',
                year: '2026',
                tagline: 'When a mysterious sea creature terrorizes a small Newfoundland town...',
                category: 'Movie',
                industry: 'Hollywood',
                breadcrumb: 'MOVIE › HOLLYWOOD',
                language: 'English',
                rating: '6.4',
                ageRating: 'PG-13',
                duration: '1h 55m',
                platform: 'HD',
                uploadedAt: Date.now() - 3600000,
                baseViews: 472,
                safetyLevel: 'Safe',
                backdrop: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1280',
                poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500',
                stills: [
                    'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1280',
                    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280',
                    'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1280'
                ],
                trailerUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                genres: ['Mystery', 'Thriller'],
                tags: ['Hollywood', '2026', 'Movie'],
                summary: 'Lowen Ashleigh, a struggling writer, is hired to complete the remaining books of a successful series after injured author Verity Crawford is unable to continue. Lowen arrives at the Crawford home, ready to sort through years of notes and outlines.',
                parentalGuide: { sexNudity: 'Mild romance scenes.', violence: 'Mild thriller tension.', profanity: 'Minor language.', drugsAlcohol: 'None.' },
                verdict: 'Suitable for mature teens and adults.',
                cast: [{ name: 'Anne Hathaway', role: 'Lowen' }, { name: 'Josh Hartnett', role: 'Jeremy' }],
                episodes: [],
                defaultComments: [{ user: 'Alex', text: 'Amazing psychological thriller!', time: '2 hours ago' }]
            },
            {
                id: 'def-2',
                slug: 'alibaba-aur-40-bhoot',
                title: 'Alibaba Aur 40 Bhoot',
                year: '2025',
                tagline: 'An epic fantasy adventure exploring hidden caves and ancient treasures.',
                category: 'TV Series',
                industry: 'Bollywood',
                breadcrumb: 'TV SERIES › BOLLYWOOD',
                language: 'Hindi',
                rating: '7.8',
                ageRating: 'TV-14',
                duration: '1 Season',
                platform: 'AMZN',
                uploadedAt: Date.now() - 86400000,
                baseViews: 1250,
                safetyLevel: 'Moderate',
                backdrop: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1280',
                poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500',
                stills: [
                    'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1280',
                    'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1280'
                ],
                trailerUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                genres: ['Action', 'Fantasy'],
                tags: ['Bollywood', 'Series', '2025'],
                summary: 'A poor woodcutter stumbles upon a magical cave belonging to forty thieves, unlocking an adventure that changes his destiny forever.',
                parentalGuide: { sexNudity: 'None.', violence: 'Action combat sequences.', profanity: 'None.', drugsAlcohol: 'None.' },
                verdict: 'Great family entertainment.',
                cast: [{ name: 'Ali Fazal', role: 'Alibaba' }],
                episodes: [
                    { season: 1, ep: 1, title: 'The Magical Cave', poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300' },
                    { season: 1, ep: 2, title: 'Secret of the Thieves', poster: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=300' }
                ],
                defaultComments: []
            }
        ];

        let currentCategory = 'All';
        let searchQuery = '';
        let isTwoColumnGrid = true;
        let activeSlideIndex = 0;
        let slideInterval = null;

        function getAllPosts() {
            const custom = JSON.parse(localStorage.getItem('cineguide_custom_reviews') || '[]');
            return [...custom, ...defaultPosts];
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkUserAuthSession();
            router();
            lucide.createIcons();
        });

        function router() {
            const params = new URLSearchParams(window.location.search);
            const postSlug = params.get('post');
            if (postSlug) {
                renderPostDetail(postSlug);
            } else {
                renderFeed();
            }
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(b => {
                b.className = "cat-tab px-3.5 py-1.5 rounded-xl bg-card border border-subtle text-slate-300 whitespace-nowrap";
            });
            const activeBtn = document.getElementById(`catBtn-${cat}`);
            if (activeBtn) activeBtn.className = "cat-tab px-3.5 py-1.5 rounded-xl bg-rose-600 text-white whitespace-nowrap";
            renderFeed();
        }

        function handleLiveSearch(val) {
            searchQuery = val.toLowerCase();
            renderFeed();
        }

        function toggleLayoutGrid() {
            isTwoColumnGrid = !isTwoColumnGrid;
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('mainContainer');
            const posts = getAllPosts();
            
            const filtered = posts.filter(p => {
                const matchCat = currentCategory === 'All' || p.category === currentCategory;
                const matchQuery = !searchQuery || p.title.toLowerCase().includes(searchQuery) || (p.genres && p.genres.join(' ').toLowerCase().includes(searchQuery));
                return matchCat && matchQuery;
            });

            container.innerHTML = `
                <!-- View Options & Filter Bar -->
                <div class="flex items-center justify-between bg-card border border-subtle p-3 rounded-2xl">
                    <span class="text-xs text-slate-400 font-bold">${filtered.length} Reviews Found</span>
                    <button onclick="toggleLayoutGrid()" class="px-3 py-1.5 rounded-xl bg-elevated text-xs font-bold text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="${isTwoColumnGrid ? 'grid' : 'square'}" class="w-3.5 h-3.5"></i> ${isTwoColumnGrid ? '2-Col Grid' : 'Single Col'}
                    </button>
                </div>

                <!-- Posts Grid -->
                <div class="grid ${isTwoColumnGrid ? 'grid-cols-2 sm:grid-cols-3' : 'grid-cols-1'} gap-3.5">
                    ${filtered.map(p => `
                        <div onclick="window.location.href='?post=${p.slug || p.id}'" class="bg-card border border-subtle rounded-2xl overflow-hidden cursor-pointer hover:border-rose-500 transition group flex flex-col justify-between">
                            <div class="relative aspect-[2/3] bg-black overflow-hidden">
                                <img src="${p.poster}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <span class="absolute top-2 left-2 px-2 py-0.5 rounded bg-black/75 text-[10px] font-bold text-amber-400 uppercase">${p.category}</span>
                                <span class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/75 text-[10px] font-bold text-white flex items-center gap-1">★ ${p.rating}</span>
                            </div>
                            <div class="p-3">
                                <h4 class="font-extrabold text-xs sm:text-sm text-white truncate mb-0.5">${p.title} <span class="text-slate-400 font-normal">(${p.year})</span></h4>
                                <p class="text-[11px] text-slate-400 truncate">${p.breadcrumb || p.industry}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function renderPostDetail(slugOrId) {
            const posts = getAllPosts();
            const post = posts.find(p => p.slug === slugOrId || p.id === slugOrId);
            const container = document.getElementById('mainContainer');

            if (!post) {
                container.innerHTML = `<div class="text-center py-20"><p class="text-sm text-slate-400">Post not found.</p><a href="index.html" class="text-rose-500 underline text-xs mt-2 inline-block">Back to Home</a></div>`;
                return;
            }

            const stills = post.stills && post.stills.length ? post.stills : [post.backdrop];

            container.innerHTML = `
                <div class="space-y-4">
                    <!-- Backdrop Carousel Slider -->
                    <div class="relative aspect-video rounded-3xl overflow-hidden bg-black border border-subtle shadow-2xl">
                        <div id="carouselSlides" class="w-full h-full flex transition-transform duration-500 ease-out" style="width: ${stills.length * 100}%;">
                            ${stills.map(img => `<img src="${img}" class="w-full h-full object-cover shrink-0" style="width: ${100 / stills.length}%;">`).join('')}
                        </div>
                        <div class="absolute inset-0 bg-gradient-to-t from-[#090a0f] via-transparent to-transparent"></div>
                        
                        <!-- Carousel Controls & Dots -->
                        <div class="absolute bottom-3 left-4 right-4 flex items-center justify-between">
                            <div class="flex items-center gap-1.5" id="carouselDots">
                                ${stills.map((_, i) => `<span class="w-2 h-2 rounded-full ${i === 0 ? 'bg-rose-500 w-5' : 'bg-white/50'} transition-all"></span>`).join('')}
                            </div>
                            <span class="px-2.5 py-1 rounded-lg bg-black/60 text-[10px] font-bold text-white uppercase">${post.category} › ${post.industry}</span>
                        </div>
                    </div>

                    <!-- Title & Meta -->
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black text-white">${post.title} <span class="text-slate-400 font-normal">(${post.year})</span></h1>
                        <p class="text-xs text-slate-300 mt-1">${post.tagline || post.summary}</p>
                    </div>

                    <!-- Action Badges Bar -->
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="px-3 py-1.5 rounded-xl bg-amber-500/15 text-amber-400 text-xs font-bold flex items-center gap-1">★ ${post.rating} IMDb</span>
                        <span class="px-3 py-1.5 rounded-xl bg-card border border-subtle text-xs font-bold text-slate-300">${post.ageRating || 'PG-13'}</span>
                        <span class="px-3 py-1.5 rounded-xl bg-card border border-subtle text-xs font-bold text-slate-300">${post.duration || '1h 50m'}</span>
                        <span class="px-3 py-1.5 rounded-xl bg-card border border-subtle text-xs font-bold text-slate-300">${post.language || 'English'}</span>
                    </div>

                    <!-- Trailer Section -->
                    <div class="p-4 rounded-2xl bg-card border border-subtle">
                        <h3 class="text-xs font-bold uppercase text-rose-400 mb-2.5 flex items-center gap-1.5"><i data-lucide="play-circle" class="w-4 h-4"></i> Official Trailer</h3>
                        <div class="aspect-video rounded-xl overflow-hidden bg-black">
                            <iframe src="${post.trailerUrl || 'https://www.youtube.com/embed/dQw4w9WgXcQ'}" class="w-full h-full" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Seasons & Episodes (If Series / Anime) -->
                    ${post.episodes && post.episodes.length > 0 ? `
                        <div class="p-4 rounded-2xl bg-card border border-subtle space-y-3">
                            <h3 class="text-xs font-bold uppercase text-amber-400 flex items-center gap-1.5"><i data-lucide="film" class="w-4 h-4"></i> Episodes & Seasons</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                ${post.episodes.map(ep => `
                                    <div class="p-2.5 rounded-xl bg-[#090a0f] border border-subtle flex items-center gap-3">
                                        <img src="${ep.poster || post.poster}" class="w-12 h-16 object-cover rounded-lg">
                                        <div>
                                            <h4 class="text-xs font-bold">Season ${ep.season} • Ep ${ep.ep}</h4>
                                            <p class="text-[11px] text-slate-400 truncate">${ep.title}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Parental Guide -->
                    <div class="p-4 rounded-2xl bg-card border border-subtle space-y-2">
                        <h3 class="text-xs font-bold uppercase text-emerald-400 flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4"></i> Complete Parental Guide</h3>
                        <p class="text-xs text-slate-300"><strong class="text-white">Verdict:</strong> ${post.verdict}</p>
                    </div>

                    <!-- Comments Section (Login Restricted) -->
                    <div class="p-4 rounded-2xl bg-card border border-subtle space-y-4">
                        <h3 class="text-xs font-bold uppercase text-slate-400 flex items-center gap-1.5"><i data-lucide="message-square" class="w-4 h-4"></i> Discussion & Reviews</h3>
                        
                        <div id="commentFormWrapper"></div>
                        <div id="commentsList" class="space-y-2.5"></div>
                    </div>

                    <div class="pt-4">
                        <a href="index.html" class="px-4 py-2 rounded-xl bg-card border border-subtle text-xs font-bold text-slate-300 hover:text-white inline-flex items-center gap-1.5">
                            ← Back to Home Feed
                        </a>
                    </div>
                </div>
            `;
            initCarousel(stills.length);
            renderCommentsSection(post);
            lucide.createIcons();
        }

        function initCarousel(totalSlides) {
            if (totalSlides <= 1) return;
            let current = 0;
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                current = (current + 1) % totalSlides;
                const slider = document.getElementById('carouselSlides');
                if (slider) {
                    slider.style.transform = `translateX(-${current * (100 / totalSlides)}%)`;
                    const dots = document.querySelectorAll('#carouselDots span');
                    dots.forEach((d, idx) => {
                        d.className = `w-2 h-2 rounded-full ${idx === current ? 'bg-rose-500 w-5' : 'bg-white/50'} transition-all`;
                    });
                }
            }, 3500);
        }

        function checkUserAuthSession() {
            const user = localStorage.getItem('cineguide_logged_user');
            const btn = document.getElementById('userAuthNavBtn');
            if (user) {
                btn.textContent = user;
                btn.onclick = () => {
                    if (confirm('Logout from account?')) {
                        localStorage.removeItem('cineguide_logged_user');
                        location.reload();
                    }
                };
            }
        }

        function openUserAuthModal() {
            if (localStorage.getItem('cineguide_logged_user')) return;
            document.getElementById('userAuthModal').classList.remove('hidden');
        }

        function closeUserAuthModal() {
            document.getElementById('userAuthModal').classList.add('hidden');
        }

        function handleUserLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            if (!username) return;
            localStorage.setItem('cineguide_logged_user', username);
            closeUserAuthModal();
            checkUserAuthSession();
            location.reload();
        }

        function renderCommentsSection(post) {
            const formWrapper = document.getElementById('commentFormWrapper');
            const listWrapper = document.getElementById('commentsList');
            const loggedUser = localStorage.getItem('cineguide_logged_user');

            if (!loggedUser) {
                formWrapper.innerHTML = `
                    <div class="p-3 rounded-xl bg-[#090a0f] border border-subtle text-center">
                        <p class="text-xs text-slate-400 mb-2">You must be logged in to post a comment.</p>
                        <button onclick="openUserAuthModal()" class="px-4 py-2 rounded-xl accent-bg text-white font-bold text-xs">Login Now</button>
                    </div>
                `;
            } else {
                formWrapper.innerHTML = `
                    <form onsubmit="submitUserComment(event, '${post.slug || post.id}')" class="space-y-2">
                        <textarea id="userCommentText" rows="2" required placeholder="Write your review or comment..." class="w-full p-3 rounded-xl bg-[#090a0f] border border-subtle text-xs"></textarea>
                        <button type="submit" class="px-4 py-2 rounded-xl accent-bg text-white font-bold text-xs">Post Comment</button>
                    </form>
                `;
            }

            const allComments = [...(post.defaultComments || []), ...(JSON.parse(localStorage.getItem(`cineguide_comments_${post.slug || post.id}`) || '[]'))];
            if (allComments.length === 0) {
                listWrapper.innerHTML = `<p class="text-xs text-slate-500">No comments yet. Be the first to review!</p>`;
                return;
            }

            listWrapper.innerHTML = allComments.map(c => `
                <div class="p-3 rounded-xl bg-[#090a0f] border border-subtle">
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-xs text-rose-400">${c.user}</span>
                        <span class="text-[10px] text-slate-500">${c.time}</span>
                    </div>
                    <p class="text-xs text-slate-300">${c.text}</p>
                </div>
            `).join('');
        }

        function submitUserComment(e, postId) {
            e.preventDefault();
            const text = document.getElementById('userCommentText').value.trim();
            const user = localStorage.getItem('cineguide_logged_user');
            if (!text || !user) return;

            const key = `cineguide_comments_${postId}`;
            const existing = JSON.parse(localStorage.getItem(key) || '[]');
            existing.unshift({ user, text, time: 'Just now' });
            localStorage.setItem(key, JSON.stringify(existing));

            document.getElementById('userCommentText').value = '';
            renderCommentsSection(getAllPosts().find(p => p.slug === postId || p.id === postId));
        }
    </script>
</body>
</html>
